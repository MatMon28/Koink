<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#EFE9DD" />
    <!-- pwa:start (manifest, home-screen icon and standalone hints; see docs/pwa.md) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Koink" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="application-name" content="Koink" />
    <!-- pwa:end -->
    <meta name="description" content="Koink: a local-first journal for income, expenses, budgets and savings. No account, works offline." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Koink — Local-First Personal Finance</title>
    <script>
      // First paint in saved colours before stylesheet arrives
      (function () {
        try {
          var boot = JSON.parse(localStorage.getItem('koink_boot') || localStorage.getItem('koins_boot') || 'null');
          if (!boot) return;
          var root = document.documentElement;
          if (boot.theme) root.setAttribute('data-theme', boot.theme);
          if (boot.style) root.setAttribute('data-style', boot.style);
          if (boot.ultra) root.setAttribute('data-ultra', 'true');
          if (/^#[0-9a-fA-F]{6}$/.test(boot.bg || '')) {
            root.style.backgroundColor = boot.bg;
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', boot.bg);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
