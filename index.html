<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="theme-color" content="#EFE9DD" />

    <!-- PWA configuration -->
    <!-- pwa:start (manifest, home-screen icon and standalone hints; see docs/pwa.md) -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Koink" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="application-name" content="Koink" />
    <!-- pwa:end -->

    <meta
      name="description"
      content="Koink: a local-first journal for your income, expenses, budgets and savings."
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <title>Koink — Money Journal</title>

    <!-- Apply saved theme before the first paint. -->
    <script>
      (function () {
        try {
          var boot = JSON.parse(
            localStorage.getItem('koink_boot') ||
            localStorage.getItem('koins_boot') ||
            'null'
          );

          if (!boot) return;

          var root = document.documentElement;

          if (boot.theme) {
            root.setAttribute('data-theme', boot.theme);
          }

          if (boot.style) {
            root.setAttribute('data-style', boot.style);
          }

          if (boot.ultra) {
            root.setAttribute('data-ultra', 'true');
          }

          if (/^#[0-9a-fA-F]{6}$/.test(boot.bg || '')) {
            root.style.backgroundColor = boot.bg;

            var meta = document.querySelector(
              'meta[name="theme-color"]'
            );

            if (meta) {
              meta.setAttribute('content', boot.bg);
            }
          }
        } catch (e) {
          // Storage unavailable: the app uses its default theme.
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>

    <!-- Main React application -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
