imation-timing-function:cubic-bezier(.5,0,.8,.5);}95%,100%{opacity:1;transform:translateY(0)}}</style><rect width="1024" height="1024" fill="#070A14"/><g class="kk-logo"><g class="kk-k" fill="#F9F3E6"><rect class="kk-stem" x="246.5" y="224.5" width="121.7" height="567.6" rx="54"/><path class="kk-arm" d="M314.72 530L583.1 249.78A82 82 0 0 1 642.32 224.5L642.43 224.5A47 47 0 0 1 676.07 304.32L455.93 530Z"/><path class="kk-leg" d="M339.08 500L592.42 766.59A82 82 0 0 0 651.86 792.1L657.84 792.1A47 47 0 0 0 692.13 712.96L464.4 470Z"/></g><g class="kk-halo" fill="#070A14" stroke="#070A14" stroke-width="81" stroke-linejoin="round" stroke-linecap="round"><path d="M569 583.4L577.3 459.7L635.6 525.1"/><path d="M796.2 583.4L787.9 459.7L729.6 525.1"/><circle cx="682.6" cy="646" r="129.7"/></g><g class="kk-coin-a"><g class="kk-coin-b"><circle cx="682.6" cy="447" r="39" fill="none" stroke="#FFC53D" stroke-width="24"/></g></g><g class="kk-pig" fill="#070A14" stroke="#F9F3E6" stroke-width="26" stroke-linejoin="round" stroke-linecap="round"><path class="kk-ear-l" d="M569 583.4L577.3 459.7L635.6 525.1"/><path class="kk-ear-r" d="M796.2 583.4L787.9 459.7L729.6 525.1"/><circle class="kk-head-fill" cx="682.6" cy="646" r="129.7" stroke="none"/><circle class="kk-head" cx="682.6" cy="646" r="129.7" fill="none" pathLength="100"/><g class="kk-face"><g class="kk-eyes" fill="#F9F3E6" stroke="none"><circle class="kk-eye-l" cx="634" cy="622" r="16"/><circle class="kk-eye-r" cx="731.2" cy="622" r="16"/></g><g class="kk-snout"><ellipse cx="682.6" cy="694.6" rx="56.75" ry="40.5" stroke-width="22.6"/><g fill="#F9F3E6" stroke="none"><circle cx="659.85" cy="694.6" r="10.3"/><circle cx="705.35" cy="694.6" r="10.3"/></g></g></g></g></g></svg>
