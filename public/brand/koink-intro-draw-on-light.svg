<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024"><title>Koink launch animation: draw-on (light)</title><style>svg{--intro-ms:2100ms}svg .kk-m{transform-box:fill-box;transform-origin:50% 50%}svg .kk-pig{transform-origin:50% 100%}svg .kk-earl{transform-origin:78% 88%}svg .kk-earr{transform-origin:22% 88%}svg .kk-headline{transform:rotate(-90deg);stroke-dasharray:100}svg .kk-ear,svg .kk-snouter{stroke-dasharray:100}svg .kk-headfill{animation:ki2-hf var(--intro-ms) linear both;}svg .kk-headline{animation:ki2-hl var(--intro-ms) linear both;}svg .kk-earl{animation:ki2-dl var(--intro-ms) linear both;}svg .kk-earr{animation:ki2-dr var(--intro-ms) linear both;}svg .kk-eyel{animation:ki2-e1 var(--intro-ms) linear both;}svg .kk-eyer{animation:ki2-e2 var(--intro-ms) linear both;}svg .kk-snouter{animation:ki2-sn var(--intro-ms) linear both;}svg .kk-nostril{animation:ki2-nos var(--intro-ms) linear both;}svg .kk-coinin{animation:ki2-coin var(--intro-ms) linear both;}svg .kk-ck{animation:ki2-ck var(--intro-ms) linear both;}svg .kk-pig{animation:ki2-bob var(--intro-ms) linear both;}@keyframes  ki2-hf{0%{opacity:0;}8%{opacity:0;}22%{opacity:1;}100%{opacity:1;}}@keyframes  ki2-hl{0%{stroke-dashoffset:100;opacity:0;}4%{stroke-dashoffset:100;opacity:1;animation-timing-function:cubic-bezier(.22,1,.36,1);}36%{stroke-dashoffset:0;opacity:1;}100%{stroke-dashoffset:0;opacity:1;}}@keyframes  ki2-dl{0%{stroke-dashoffset:100;opacity:0;}30%{stroke-dashoffset:100;opacity:0;}31%{stroke-dashoffset:100;opacity:1;animation-timing-function:cubic-bezier(.22,1,.36,1);}46%{stroke-dashoffset:0;opacity:1;}100%{stroke-dashoffset:0;opacity:1;}}@keyframes  ki2-dr{0%{stroke-dashoffset:100;opacity:0;}33%{stroke-dashoffset:100;opacity:0;}34%{stroke-dashoffset:100;opacity:1;animation-timing-function:cubic-bezier(.22,1,.36,1);}49%{stroke-dashoffset:0;opacity:1;}100%{stroke-dashoffset:0;opacity:1;}}@keyframes  ki2-e1{0%{transform:scale(0);}47%{transform:scale(0);animation-timing-function:cubic-bezier(.3,1.5,.5,1);}55%{transform:scale(1);}100%{transform:scale(1);}}@keyframes  ki2-e2{0%{transform:scale(0);}50%{transform:scale(0);animation-timing-function:cubic-bezier(.3,1.5,.5,1);}58%{transform:scale(1);}100%{transform:scale(1);}}@keyframes  ki2-sn{0%{stroke-dashoffset:100;opacity:0;}52%{stroke-dashoffset:100;opacity:0;}53%{stroke-dashoffset:100;opacity:1;animation-timing-function:cubic-bezier(.22,1,.36,1);}66%{stroke-dashoffset:0;opacity:1;}100%{stroke-dashoffset:0;opacity:1;}}@keyframes  ki2-nos{0%{transform:scale(0);}63%{transform:scale(0);animation-timing-function:cubic-bezier(.3,1.5,.5,1);}70%{transform:scale(1);}100%{transform:scale(1);}}@keyframes  ki2-coin{0%{transform:scale(0) rotate(-180deg);}68%{transform:scale(0) rotate(-180deg);animation-timing-function:cubic-bezier(.3,1.5,.5,1);}85%{transform:scale(1.12) rotate(4deg);}91%{transform:scale(.97) rotate(0deg);}95%{transform:scale(1) rotate(0deg);}100%{transform:scale(1) rotate(0deg);}}@keyframes  ki2-ck{0%{opacity:0;transform:scale(2.4);}82%{opacity:0;transform:scale(2.4);}83%{opacity:1;transform:scale(2.4);animation-timing-function:cubic-bezier(.2,.7,.3,1);}91%{opacity:1;transform:scale(.86);animation-timing-function:ease-in-out;}96%{opacity:1;transform:scale(1.05);}100%{opacity:1;transform:scale(1);}}@keyframes  ki2-bob{0%{transform:scale(1);}88%{transform:scale(1);animation-timing-function:ease-in-out;}92%{transform:scale(1.03,.97);animation-timing-function:ease-in-out;}97%{transform:scale(.99,1.01);}100%{transform:scale(1);}}</style><defs><clipPath id="kk-tile-clip"><rect width="1024" height="1024" rx="240"/></clipPath></defs><g clip-path="url(#kk-tile-clip)"><rect width="1024" height="1024" fill="#F9F3E6"/><g transform="translate(512 512) scale(1.85) translate(0 73.15)"><g class="kk-m kk-all"><g class="kk-m kk-coin"><g class="kk-m kk-coinx"><circle class="kk-m kk-ring" cx="0" cy="-219" r="62" fill="none" stroke="#F59F00" stroke-width="10" opacity="0"/><g class="kk-m kk-coinin"><circle cx="0" cy="-219" r="62" fill="#F59F00"/><g class="kk-m kk-ck"><g transform="translate(0 -219) scale(0.123) translate(-469.32 -508.3)" fill="#F9F3E6"><rect x="246.5" y="224.5" width="121.7" height="567.6" rx="54"/><path d="M314.72 530L583.1 249.78A82 82 0 0 1 642.32 224.5L642.43 224.5A47 47 0 0 1 676.07 304.32L455.93 530Z"/><path d="M339.08 500L592.42 766.59A82 82 0 0 0 651.86 792.1L657.84 792.1A47 47 0 0 0 692.13 712.96L464.4 470Z"/></g></g></g></g></g><g class="kk-m kk-pig"><path class="kk-m kk-ear kk-earl" pathLength="100" d="M-113.6 -62.6L-105.3 -186.3L-47 -120.9" fill="#F9F3E6" stroke="#0B0F1E" stroke-width="26" stroke-linejoin="round" stroke-linecap="round"/><path class="kk-m kk-ear kk-earr" pathLength="100" d="M113.6 -62.6L105.3 -186.3L47 -120.9" fill="#F9F3E6" stroke="#0B0F1E" stroke-width="26" stroke-linejoin="round" stroke-linecap="round"/><circle class="kk-m kk-headfill" r="129.7" fill="#F9F3E6"/><circle class="kk-m kk-headline" pathLength="100" r="129.7" fill="none" stroke="#0B0F1E" stroke-width="26"/><g class="kk-m kk-eyes"><circle class="kk-m kk-eye kk-eyel" cx="-48.6" cy="-24" r="16" fill="#0B0F1E"/><circle class="kk-m kk-eye kk-eyer" cx="48.6" cy="-24" r="16" fill="#0B0F1E"/></g><g class="kk-m kk-snout"><ellipse class="kk-m kk-snouter" pathLength="100" cx="0" cy="48.6" rx="56.75" ry="40.5" fill="none" stroke="#0B0F1E" stroke-width="22.6"/><circle class="kk-m kk-nostril" cx="-22.75" cy="48.6" r="10.3" fill="#0B0F1E"/><circle class="kk-m kk-nostril" cx="22.75" cy="48.6" r="10.3" fill="#0B0F1E"/></g></g></g></g></g></svg>
