<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024"><title>Koink launch animation: pop-toss (dark)</title><style>svg{--intro-ms:980ms}svg .kk-logo{transform-origin:535px 508px}svg .kk-k{transform-origin:470px 508px}svg .kk-stem{transform-origin:307px 224.5px}svg .kk-arm,svg .kk-leg{transform-origin:372px 510px}svg .kk-halo,svg .kk-pig,svg .kk-head-fill,svg .kk-head{transform-origin:682.6px 646px}svg .kk-ear-l{transform-origin:602px 554px}svg .kk-ear-r{transform-origin:763.2px 554px}svg .kk-eyes{transform-origin:682.6px 622px}svg .kk-eye-l{transform-origin:634px 622px}svg .kk-eye-r{transform-origin:731.2px 622px}svg .kk-snout,svg .kk-face{transform-origin:682.6px 694.6px}svg .kk-coin-a,svg .kk-coin-b{transform-origin:682.6px 447px}svg .kk-k{animation:k4-k var(--intro-ms) linear both}svg .kk-halo,svg .kk-pig{transform-origin:682.6px 789px;animation:k4-pig var(--intro-ms) linear both}svg .kk-ear-l{animation:k4-ear-l var(--intro-ms) linear both}svg .kk-ear-r{animation:k4-ear-r var(--intro-ms) linear both}svg .kk-coin-a{animation:k4-coin-x var(--intro-ms) linear both}svg .kk-coin-b{animation:k4-coin-y var(--intro-ms) linear both}@keyframes k4-k{0%{opacity:0;transform:scale(1.28);animation-timing-function:cubic-bezier(.5,0,.8,.4);}14%{opacity:1;transform:scale(.95);animation-timing-function:cubic-bezier(.3,1.5,.5,1);}30%,100%{opacity:1;transform:scale(1)}}@keyframes k4-pig{0%,18%{opacity:0;transform:translateY(120px) scale(.2,.2)}20%{opacity:1;transform:translateY(120px) scale(.2,.2);animation-timing-function:cubic-bezier(.2,.8,.3,1);}40%{transform:translateY(-34px) scale(1.03,1.07);animation-timing-function:cubic-bezier(.5,0,.8,.5);}50%{transform:translateY(0) scale(1.05,.95);animation-timing-function:ease-out;}60%,100%{opacity:1;transform:translateY(0) scale(1,1)}}@keyframes k4-ear-l{0%,48%{transform:rotate(0deg)}56%{transform:rotate(-14deg)}64%{transform:rotate(8deg)}72%{transform:rotate(-4deg)}80%,100%{transform:rotate(0deg)}}@keyframes k4-ear-r{0%,48%{tra