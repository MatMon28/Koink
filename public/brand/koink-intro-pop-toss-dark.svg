<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024"><title>Koink launch animation: pop-toss (dark)</title><style>svg{--intro-ms:1800ms}svg .kk-m{transform-box:fill-box;transform-origin:50% 50%}svg .kk-pig{transform-origin:50% 100%}svg .kk-earl{transform-origin:78% 88%}svg .kk-earr{transform-origin:22% 88%}svg .kk-pig{animation:ki3-pig var(--intro-ms) linear both;}svg .kk-coin{animation:ki3-coin var(--intro-ms) linear both;}svg .kk-coinx{animation:ki3-cx var(--intro-ms) linear both;}svg .kk-coinin{animation:ki3-spin var(--intro-ms) linear both;}svg .kk-snout{animation:ki3-snout var(--intro-ms) linear both;}svg .kk-eyes{animation:ki3-eyes var(--intro-ms) linear both;}@keyframes  ki3-pig{0%{transform:translateY(560px) scale(1,1);}8%{transform:translateY(560px) scale(.9,1.14);animation-timing-function:cubic-bezier(.2,.7,.3,1);}24%{transform:translateY(-34px) scale(.92,1.12);animation-timing-function:ease-in-out;}32%{transform:translateY(0) scale(1.1,.88);animation-timing-function:ease-in-out;}40%{transform:translateY(0) scale(.97,1.04);}48%{transform:translateY(0) scale(1,1);}100%{transform:translateY(0) scale(1,1);}}@keyframes  ki3-coin{0%{opacity:0;transform:translateY(214px);}38%{opacity:0;transform:translateY(214px);}39%{opacity:1;transform:translateY(214px);animation-timing-function:cubic-bezier(.2,.7,.3,1);}56%{opacity:1;transform:translateY(-110px);animation-timing-function:cubic-bezier(.55,0,.9,.5);}74%{opacity:1;transform:translateY(0);animation-timing-function:cubic-bezier(.2,.7,.3,1);}80%{opacity:1;transform:translateY(-26px);animation-timing-function:cubic-bezier(.55,0,.9,.5);}86%{opacity:1;transform:translateY(0);}100%{opacity:1;transform:translateY(0);}}@keyframes  ki3-cx{0%{transform:translateX(0);}39%{transform:translateX(0);animation-timing-function:cubic-bezier(.2,.7,.3,1);}58%{transform:translateX(64px);animation-timing-function:ease-in-out;}76%{transform:translateX(0);}100%{transform:translateX(0);}}@keyframes  ki3-spin{0%{transform:scaleX(1);}40%{transform:scaleX(1);animation-timing-function:ease-in-out;}46%{transform:scaleX(.1);animation-timing-function:ease-in-out;}52%{transform:scaleX(1);animation-timing-function:ease-in-out;}58%{transform:scaleX(.1);animation-timing-function:ease-in-out;}64%{transform:scaleX(1);animation-timing-function:ease-in-out;}69%{transform:scaleX(.1);animation-timing-function:ease-in-out;}74%{transform:scaleX(1);}100%{transform:scaleX(1);}}@keyframes  ki3-snout{0%{transform:scale(1);}34%{transform:scale(1);animation-timing-function:ease-in-out;}40%{transform:scale(1.32);animation-timing-function:ease-in-out;}47%{transform:scale(.94);}53%{transform:scale(1);}100%{transform:scale(1);}}@keyframes  ki3-eyes{0%{transform:scaleY(1);}36%{transform:scaleY(1);}40%{transform:scaleY(.15);}46%{transform:scaleY(.15);}52%{transform:scaleY(1);}100%{transform:scaleY(1);}}</style><defs><clipPath id="kk-tile-clip"><rect width="1024" height="1024" rx="240"/></clipPath></defs><g clip-path="url(#kk-tile-clip)"><rect width="1024" height="1024" fill="#070A14"/><g transform="translate(512 512) scale(1.85) translate(0 73.15)"><g class="kk-m kk-all"><g class="kk-m kk-coin"><g class="kk-m kk-coinx"><circle class="kk-m kk-ring" cx="0" cy="-219" r="62" fill="none" stroke="#FFC53D" stroke-width="10" opacity="0"/><g class="kk-m kk-coinin"><circle cx="0" cy="-219" r="62" fill="#FFC53D"/><g class="kk-m kk-ck"><g transform="translate(0 -219) scale(0.123) translate(-469.32 -508.3)" fill="#070A14"><rect x="246.5" y="224.5" width="121.7" height="567.6" rx="54"/><path d="M314.72 530L583.1 249.78A82 82 0 0 1 642.32 224.5L642.43 224.5A47 47 0 0 1 676.07 304.32L455.93 530Z"/><path d="M339.08 500L592.42 766.59A82 82 0 0 0 651.86 792.1L657.84 792.1A47 47 0 0 0 692.13 712.96L464.4 470Z"/></g></g></g></g></g><g class="kk-m kk-pig"><path class="kk-m kk-ear kk-earl" pathLength="100" d="M-113.6 -62.6L-105.3 -186.3L-47 -120.9" fill="#070A14" stroke="#F9F3E6" stroke-width="26" stroke-linejoin="round" stroke-linecap="rou