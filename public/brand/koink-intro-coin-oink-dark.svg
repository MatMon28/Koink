<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024"><title>Koink launch animation: coin-oink (dark)</title><style>svg{--intro-ms:1250ms}svg .kk-logo{transform-origin:535px 508px}svg .kk-k{transform-origin:470px 508px}svg .kk-stem{transform-origin:307px 224.5px}svg .kk-arm,svg .kk-leg{transform-origin:372px 510px}svg .kk-halo,svg .kk-pig,svg .kk-head-fill,svg .kk-head{transform-origin:682.6px 646px}svg .kk-ear-l{transform-origin:602px 554px}svg .kk-ear-r{transform-origin:763.2px 554px}svg .kk-eyes{transform-origin:682.6px 622px}svg .kk-eye-l{transform-origin:634px 622px}svg .kk-eye-r{transform-origin:731.2px 622px}svg .kk-snout,svg .kk-face{transform-origin:682.6px 694.6px}svg .kk-coin-a,svg .kk-coin-b{transform-origin:682.6px 447px}svg .kk-logo{animation:k1-in var(--intro-ms) linear both}svg .kk-coin-a{animation:k1-coin var(--intro-ms) linear both}svg .kk-coin-b{animation:k1-turn var(--intro-ms) linear both}svg .kk-halo,svg .kk-pig{transform-origin:682.6px 789px;animation:k1-oink var(--intro-ms) linear both}svg .kk-snout{animation:k1-snout var(--intro-ms) linear both}svg .kk-eyes{animation:k1-eyes var(--intro-ms) linear both}svg .kk-ear-l{animation:k1-ear-l var(--intro-ms) linear both}svg .kk-ear-r{animation:k1-ear-r var(--intro-ms) linear both}@keyframes k1-in{0%{opacity:0;transform:scale(.84);animation-timing-function:cubic-bezier(.22,1,.36,1);}10%{opacity:1}18%,100%{opacity:1;transform:scale(1)}}@keyframes k1-coin{0%,18%{opacity:1;transform:translateY(0) scale(1);animation-timing-function:cubic-bezier(.2,.7,.3,1);}30%{transform:translateY(-150px) scale(1);animation-timing-function:ease-in-out;}38%{transform:translateY(-164px) scale(1);animation-timing-function:ease-in-out;}46%{transform:translateY(-150px) scale(1);animation-timing-function:cubic-bezier(.55,0,.9,.5);}56%{opacity:1;transform:translateY(200px) scale(1)}57%{opacity:0;transform:translateY(200px) scale(1)}58%,80%{opacity:0;transform:translateY(0) scale(.2);animation-timing-function:cubic-bezier(.3,1.5,.5,1);}84%{opacity:1}92%,100%{opacity:1;transform:translateY(0) scale(1)}}@keyframes k1-turn{0%,22%{transform:scaleX(1);animation-timing-function:cubic-bezier(.12,0,.39,0);}28%{transform:scaleX(0);animation-timing-function:cubic-bezier(.61,1,.88,1);}34%{transform:scaleX(-1);animation-timing-function:cubic-bezier(.12,0,.39,0);}40%{transform:scaleX(0);animation-timing-function:cubic-bezier(.61,1,.88,1);}46%,100%{transform:scaleX(1)}}@keyframes k1-oink{0%,55%{transform:translateY(0) scale(1,1);animation-timing-function:ease-out;}61%{transform:translateY(0) scale(1.06,.93);animation-timing-function:cubic-bezier(.3,0,.3,1);}69%{transform:translateY(-30px) scale(.96,1.05);animation-timing-function:cubic-bezier(.5,0,.7,.6);}77%{transform:translateY(0) scale(1.03,.97);animation-timing-function:ease-out;}85%,100%{transform:translateY(0) scale(1,1)}}@keyframes k1-snout{0%,60%{transform:scale(1);animation-timing-function:cubic-bezier(.3,1.5,.5,1);}68%{transform:scale(1.3);animation-timing-function:ease-in-out;}75%{transform:scale(.93)}82%,100%{transform:scale(1)}}@keyframes k1-eyes{0%,56%{transform:scaleY(1)}60%,70%{transform:scaleY(.12)}76%,100%{transform:scaleY(1)}}@keyframes k1-ear-l{0%,58%{transform:rotate(0deg)}66%{transform:rotate(-17deg)}74%{transform:rotate(7deg)}82%,100%{transform:rotate(0deg)}}@keyframes k1-ear-r{0%,58%{transform:rotate(0deg)}66%{transform:rotate(17deg)}74%{transform:rotate(-7deg)}82%,100%{transform:rotate(0deg)}}</style><rect width="1024" height="1024" fill="#070A14"/><g class="kk-logo"><g class="kk-k" fill="#F9F3E6"><rect class="kk-stem" x="246.5" y="224.5" width="121.7" height="567.6" rx="54"/><path class="kk-arm" d="M314.72 530L583.1 249.78A82 82 0 0 1 642.32 224.5L642.43 224.5A47 47 0 0 1 676.07 304.32L455.93 530Z"/><path class="kk-leg" d="M339.08 500L592.42 766.59A82 82 0 0 0 651.86 792.1L657.84 792.1A47 47 0 0 0 692.13 712.96L464.4 470Z"/></g><g class="kk-halo" fill="#070A14" stroke="#070A14" stroke-width="81" stroke-linejoin="roun