<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024"><title>Koink loader animation: spin-loop (light)</title><style>svg{--intro-ms:1700ms}svg .kk-m{transform-box:fill-box;transform-origin:50% 50%}svg .kk-pig{transform-origin:50% 100%}svg .kk-earl{transform-origin:78% 88%}svg .kk-earr{transform-origin:22% 88%}svg .kk-coin{animation:kl-bob var(--intro-ms) linear both;animation-iteration-count:infinite;}svg .kk-coinin{animation:kl-spin var(--intro-ms) linear both;animation-iteration-count:infinite;}svg .kk-pig{animation:kl-nod var(--intro-ms) linear both;animation-iteration-count:infinite;}svg .kk-eyes{animation:kl-blink var(--intro-ms) linear both;animation-iteration-count:infinite;}@keyframes  kl-bob{0%{transform:translateY(0);}25%{transform:translateY(-26px);animation-timing-function:ease-in-out;}50%{transform:translateY(0);animation-timing-function:ease-in-out;}75%{transform:translateY(-26px);animation-timing-function:ease-in-out;}100%{transform:translateY(0);}}@keyframes  kl-spin{0%{transform:scaleX(1);}12%{transform:scaleX(.06);animation-timing-function:ease-in-out;}25%{transform:scaleX(-1);animation-timing-function:ease-in-out;}37%{transform:scaleX(-.06);animation-timing-function:ease-in-out;}50%{transform:scaleX(1);}100%{transform:scaleX(1);}}@keyframes  kl-nod{0%{transform:scale(1,1);}48%{transform:scale(1,1);animation-timing-function:ease-in-out;}52%{transform:scale(1.03,.96);animation-timing-function:ease-in-out;}58%{transform:scale(1,1);}100%{transform:scale(1,1);}}@keyframes  kl-blink{0%{transform:scaleY(1);}78%{transform:scaleY(1);}82%{transform:scaleY(.1);}87%{transform:scaleY(1);}100%{transform:scaleY(1);}}</style><defs><clipPath id="kk-tile-clip"><rect width="1024" height="1024" rx="240"/></clipPath></defs><g clip-path="url(#kk-tile-clip)"><rect width="1024" height="1024" fill="#F9F3E6"/><g transform="translate(512 512) scale(1.85) translate(0 73.15)"><g class="kk-m kk-all"><g class="kk-m kk-coin"><g class="kk-m kk-coinx"><circle class="kk-m kk-ring" cx="0" cy="-219" r="62" fill="none" stroke="#F59F00" stroke-width="10" opacity="0"/><g class="kk-m kk-coinin"><circle cx="0" cy="-219" r="62" fill="#F59F00"/><g class="kk-m kk-ck"><g transform="translate(0 -219) scale(0.123) translate(-469.32 -508.3)" fill="#F9F3E6"><rect x="246.5" y="224.5" width="121.7" height="567.6" rx="54"/><path d="M314.72 530L583.1 249.78A82 82 0 0 1 642.32 224.5L642.43 224.5A47 47 0 0 1 676.07 304.32L455.93 530Z"/><path d="M339.08 500L592.42 766.59A82 82 0 0 0 651.86 792.1L657.84 792.1A47 47 0 0 0 692.13 712.96L464.4 470Z"/></g></g></g></g></g><g class="kk-m kk-pig"><path class="kk-m kk-ear kk-earl" pathLength="100" d="M-113.6 -62.6L-105.3 -186.3L-47 -120.9" fill="#F9F3E6" stroke="#0B0F1E" stroke-width="26" stroke-linejoin="round" stroke-linecap="round"/><path class="kk-m kk-ear kk-earr" pathLength="100" d="M113.6 -62.6L105.3 -186.3L47 -120.9" fill="#F9F3E6" stroke="#0B0F1E" stroke-width="26" stroke-linejoin="round" stroke-linecap="round"/><circle class="kk-m kk-headfill" r="129.7" fill="#F9F3E6"/><circle class="kk-m kk-headline" pathLength="100" r="129.7" fill="none" stroke="#0B0F1E" stroke-width="26"/><g class="kk-m kk-eyes"><circle class="kk-m kk-eye kk-eyel" cx="-48.6" cy="-24" r="16" fill="#0B0F1E"/><circle class="kk-m kk-eye kk-eyer" cx="48.6" cy="-24" r="16" fill="#0B0F1E"/></g><g class="kk-m kk-snout"><ellipse class="kk-m kk-snouter" pathLength="100" cx="0" cy="48.6" rx="56.75" ry="40.5" fill="none" stroke="#0B0F1E" stroke-width="22.6"/><circle class="kk-m kk-nostril" cx="-22.75" cy="48.6" r="10.3" fill="#0B0F1E"/><circle class="kk-m kk-nostril" cx="22.75" cy="48.6" r="10.3" fill="#0B0F1E"/></g></g></g></g></g></svg>
