<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024"><title>Koink launch animation: coin-drop (light)</title><style>svg{--intro-ms:1900ms}svg .kk-m{transform-box:fill-box;transform-origin:50% 50%}svg .kk-pig{transform-origin:50% 100%}svg .kk-earl{transform-origin:78% 88%}svg .kk-earr{transform-origin:22% 88%}svg  .kk-all{animation:ki1-all var(--intro-ms) linear both;}svg .kk-coin{animation:ki1-coin var(--intro-ms) linear both;}svg .kk-coinin{animation:ki1-spin var(--intro-ms) linear both;}svg .kk-pig{animation:ki1-pig var(--intro-ms) linear both;}svg .kk-snout{animation:ki1-snout var(--intro-ms) linear both;}svg .kk-eyes{animation:ki1-eyes var(--intro-ms) linear both;}svg .kk-earl{animation:ki1-el var(--intro-ms) linear both;}svg .kk-earr{animation:ki1-er var(--intro-ms) linear both;}@keyframes  ki1-all{0%{opacity:0;transform:scale(.9);animation-timing-function:cubic-bezier(.22,1,.36,1);}14%{opacity:1;transform:scale(1);}100%{opacity:1;transform:scale(1);}}@keyframes  ki1-coin{0%{opacity:1;transform:translateY(0);}16%{opacity:1;transform:translateY(0);animation-timing-function:cubic-bezier(.2,.7,.3,1);}30%{opacity:1;transform:translateY(-150px);}36%{opacity:1;transform:translateY(-150px);animation-timing-function:cubic-bezier(.55,0,.9,.5);}54%{opacity:1;transform:translateY(214px);}55%{opacity:0;transform:translateY(214px);}78%{opacity:0;transform:translateY(0);}79%{opacity:1;transform:translateY(0);}100%{opacity:1;transform:translateY(0);}}@keyframes  ki1-spin{0%{transform:scale(1);}16%{transform:scaleX(1);animation-timing-function:ease-in-out;}21%{transform:scaleX(.08);animation-timing-function:ease-in-out;}26%{transform:scaleX(1);animation-timing-function:ease-in-out;}31%{transform:scaleX(.08);animation-timing-function:ease-in-out;}36%{transform:scaleX(1);}78%{transform:scale(.2);animation-timing-function:cubic-bezier(.3,1.5,.5,1);}90%{transform:scale(1.14);}95%{transform:scale(.97);}100%{transform:scale(1);}}@keyframes  ki1-pig{0%{transform:scale(1,1);}54%{transform:scale(1,1);animation-timing-function:cubic-bezier(.2,.7,.3,1);}58%{transform:scale(1.07,.88);animation-timing-function:ease-in-out;}65%{transform:scale(.96,1.06);animation-timing-function:ease-in-out;}73%{transform:scale(1.01,.99);}80%{transform:scale(1,1);}100%{transform:scale(1,1);}}@keyframes  ki1-snout{0%{transform:scale(1);}62%{transform:scale(1);animation-timing-function:ease-in-out;}68%{transform:scale(1.32);animation-timing-function:ease-in-out;}74%{transform:scale(.93);}80%{transform:scale(1);}100%{transform:scale(1);}}@keyframes  ki1-eyes{0%{transform:scaleY(1);}60%{transform:scaleY(1);}64%{transform:scaleY(.12);}71%{transform:scaleY(.12);}76%{transform:scaleY(1);}100%{transform:scaleY(1);}}@keyframes  ki1-el{0%{transform:rotate(0deg);}58%{transform:rotate(0deg);animation-timing-function:ease-in-out;}65%{transform:rotate(-15deg);animation-timing-function:ease-in-out;}73%{transform:rotate(6deg);}81%{transform:rotate(0deg);}100%{transform:rotate(0deg);}}@keyframes  ki1-er{0%{transform:rotate(0deg);}58%{transform:rotate(0deg);animation-timing-function:ease-in-out;}65%{transform:rotate(15deg);animation-timing-function:ease-in-out;}73%{transform:rotate(-6deg);}81%{transform:rotate(0deg);}100%{transform:rotate(0deg);}}</style><defs><clipPath id="kk-tile-clip"><rect width="1024" height="1024" rx="240"/></clipPath></defs><g clip-path="url(#kk-tile-clip)"><rect width="1024" height="1024" fill="#F9F3E6"/><g transform="translate(512 512) scale(1.85) translate(0 73.15)"><g class="kk-m kk-all"><g class="kk-m kk-coin"><g class="kk-m kk-coinx"><circle class="kk-m kk-ring" cx="0" cy="-219" r="62" fill="none" stroke="#F59F00" stroke-width="10" opacity="0"/><g class="kk-m kk-coinin"><circle cx="0" cy="-219" r="62" fill="#F59F00"/><g class="kk-m kk-ck"><g transform="translate(0 -219) scale(0.123) translate(-469.32 -508.3)" fill="#F9F3E6"><rect x="246.5" y="224.5" width="121.7" height="567.6" rx="54"/><path d="M314.72 530L583.1 249.78A82 82 0 0 1 642.32 224.5L