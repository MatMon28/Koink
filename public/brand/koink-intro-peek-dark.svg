<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024"><title>Koink launch animation: peek (dark)</title><style>svg{--intro-ms:2400ms}svg .kk-m{transform-box:fill-box;transform-origin:50% 50%}svg .kk-pig{transform-origin:50% 100%}svg .kk-earl{transform-origin:78% 88%}svg .kk-earr{transform-origin:22% 88%}svg .kk-pig{animation:ki5-pig var(--intro-ms) linear both;}svg .kk-eyes{animation:ki5-eyes var(--intro-ms) linear both;}svg .kk-earl{animation:ki5-el var(--intro-ms) linear both;}svg .kk-earr{animation:ki5-er var(--intro-ms) linear both;}svg .kk-coin{animation:ki5-coin var(--intro-ms) linear both;}svg .kk-coinin{animation:ki5-spin var(--intro-ms) linear both;}@keyframes  ki5-pig{0%{transform:translateY(560px) scale(1,1);}5%{transform:translateY(560px) scale(1,1);animation-timing-function:cubic-bezier(.3,1.5,.5,1);}26%{transform:translateY(0) scale(1,1);}70%{transform:translateY(0) scale(1,1);animation-timing-function:cubic-bezier(.2,.7,.3,1);}73%{transform:translateY(0) scale(1.05,.93);animation-timing-function:ease-in-out;}80%{transform:translateY(0) scale(.98,1.03);}86%{transform:translateY(0) scale(1,1);}100%{transform:translateY(0) scale(1,1);}}@keyframes  ki5-eyes{0%{transform:translate(0,0) scaleY(1);}28%{transform:translate(0,0) scaleY(1);animation-timing-function:ease-in-out;}34%{transform:translate(-18px,0) scaleY(1);}41%{transform:translate(-18px,0) scaleY(1);animation-timing-function:ease-in-out;}48%{transform:translate(18px,0) scaleY(1);}54%{transform:translate(18px,0) scaleY(1);animation-timing-function:ease-in-out;}59%{transform:translate(0,0) scaleY(1);}62%{transform:translate(0,0) scaleY(.1);}66%{transform:translate(0,0) scaleY(1);}100%{transform:translate(0,0) scaleY(1);}}@keyframes  ki5-el{0%{transform:rotate(0deg);}55%{transform:rotate(0deg);animation-timing-function:ease-in-out;}60%{transform:rotate(-14deg);animation-timing-function:ease-in-out;}65%{transform:rotate(8deg);animation-timing-function:ease-in-out;}70%{transform:rotate(0deg);}100%{transform:rotate(0deg);}}@keyframes  ki5-er{0%{transform:rotate(0deg);}58%{transform:rotate(0deg);animation-timing-function:ease-in-out;}63%{transform:rotate(14deg);animation-timing-function:ease-in-out;}68%{transform:rotate(-8deg);animation-timing-function:ease-in-out;}73%{transform:rotate(0deg);}100%{transform:rotate(0deg);}}@keyframes  ki5-coin{0%{opacity:0;transform:translateY(-460px);}50%{opacity:0;transform:translateY(-460px);}51%{opacity:1;transform:translateY(-460px);animation-timing-function:cubic-bezier(.55,0,.9,.5);}70%{opacity:1;transform:translateY(0);animation-timing-function:cubic-bezier(.2,.7,.3,1);}77%{opacity:1;transform:translateY(-34px);animation-timing-function:cubic-bezier(.55,0,.9,.5);}83%{opacity:1;transform:translateY(0);animation-timing-function:cubic-bezier(.2,.7,.3,1);}88%{opacity:1;transform:translateY(-8px);animation-timing-function:cubic-bezier(.55,0,.9,.5);}92%{opacity:1;transform:translateY(0);}100%{opacity:1;transform:translateY(0);}}@keyframes  ki5-spin{0%{transform:scaleX(1);}51%{transform:scaleX(1);animation-timing-function:ease-in-out;}57%{transform:scaleX(.1);animation-timing-function:ease-in-out;}63%{transform:scaleX(1);animation-timing-function:ease-in-out;}68%{transform:scaleX(.1);animation-timing-function:ease-in-out;}72%{transform:scaleX(1);}100%{transform:scaleX(1);}}</style><defs><clipPath id="kk-tile-clip"><rect width="1024" height="1024" rx="240"/></clipPath></defs><g clip-path="url(#kk-tile-clip)"><rect width="1024" height="1024" fill="#070A14"/><g transform="translate(512 512) scale(1.85) translate(0 73.15)"><g class="kk-m kk-all"><g class="kk-m kk-coin"><g class="kk-m kk-coinx"><circle class="kk-m kk-ring" cx="0" cy="-219" r="62" fill="none" stroke="#FFC53D" stroke-width="10" opacity="0"/><g class="kk-m kk-coinin"><circle cx="0" cy="-219" r="62" fill="#FFC53D"/><g class="kk-m kk-ck"><g transform="translate(0 -219) scale(0.123) translate(-469.32 -508.3)" fill="#070A14"><rect x="246.5" y="224.5" width="121.7" he