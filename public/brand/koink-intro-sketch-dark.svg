<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024"><title>Koink launch animation: sketch (dark)</title><style>svg{--intro-ms:1000ms}svg .kk-logo{transform-origin:535px 508px}svg .kk-k{transform-origin:470px 508px}svg .kk-stem{transform-origin:307px 224.5px}svg .kk-arm,svg .kk-leg{transform-origin:372px 510px}svg .kk-halo,svg .kk-pig,svg .kk-head-fill,svg .kk-head{transform-origin:682.6px 646px}svg .kk-ear-l{transform-origin:602px 554px}svg .kk-ear-r{transform-origin:763.2px 554px}svg .kk-eyes{transform-origin:682.6px 622px}svg .kk-eye-l{transform-origin:634px 622px}svg .kk-eye-r{transform-origin:731.2px 622px}svg .kk-snout,svg .kk-face{transform-origin:682.6px 694.6px}svg .kk-coin-a,svg .kk-coin-b{transform-origin:682.6px 447px}svg .kk-stem{animation:k2-stem var(--intro-ms) linear both}svg .kk-arm{animation:k2-arm var(--intro-ms) linear both}svg .kk-leg{animation:k2-leg var(--intro-ms) linear both}svg .kk-halo,svg .kk-head-fill{animation:k2-clear var(--intro-ms) linear both}svg .kk-head{stroke-dasharray:100 100;animation:k2-ring var(--intro-ms) linear both}svg .kk-ear-l{animation:k2-ear-l var(--intro-ms) linear both}svg .kk-ear-r{animation:k2-ear-r var(--intro-ms) linear both}svg .kk-eyes{animation:k2-eyes var(--intro-ms) linear both}svg .kk-snout{animation:k2-snout var(--intro-ms) linear both}svg .kk-coin-a{animation:k2-coin var(--intro-ms) linear both}@keyframes k2-stem{0%{transform:scaleY(0);animation-timing-function:cubic-bezier(.22,1,.36,1);}20%,100%{transform:scaleY(1)}}@keyframes k2-arm{0%,12%{transform:scale(0);animation-timing-function:cubic-bezier(.3,1.25,.5,1);}34%,100%{transform:scale(1)}}@keyframes k2-leg{0%,22%{transform:scale(0);animation-timing-function:cubic-bezier(.3,1.25,.5,1);}44%,100%{transform:scale(1)}}@keyframes k2-clear{0%,38%{transform:scale(0);animation-timing-function:cubic-bezier(.22,1,.36,1);}52%,100%{transform:scale(1)}}@keyframes k2-ring{0%,38%{stroke-dashoffset:100;transform:rotate(-90deg);animation-timing-function:cubic