<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024"><title>Koink launch animation: mint (dark)</title><style>svg{--intro-ms:2200ms}svg .kk-m{transform-box:fill-box;transform-origin:50% 50%}svg .kk-pig{transform-origin:50% 100%}svg .kk-earl{transform-origin:78% 88%}svg .kk-earr{transform-origin:22% 88%}svg .kk-coin{animation:ki4-coin var(--intro-ms) linear both;}svg .kk-coinin{animation:ki4-cin var(--intro-ms) linear both;}svg .kk-ck{animation:ki4-ck var(--intro-ms) linear both;}svg .kk-ring{animation:ki4-ring var(--intro-ms) linear both;}svg .kk-pig{animation:ki4-pig var(--intro-ms) linear both;}@keyframes  ki4-cin{0%{transform:scale(0);animation-timing-function:cubic-bezier(.3,1.5,.5,1);}12%{transform:scale(3.4);}40%{transform:scale(3.4);animation-timing-function:cubic-bezier(.22,1,.36,1);}64%{transform:scale(1);}100%{transform:scale(1);}}@keyframes  ki4-coin{0%{transform:translateY(219px);}40%{transform:translateY(219px);animation-timing-function:cubic-bezier(.22,1,.36,1);}64%{transform:translateY(0);}100%{transform:translateY(0);}}@keyframes  ki4-ck{0%{opacity:0;transform:scale(2.6);}13%{opacity:0;transform:scale(2.6);}14%{opacity:1;transform:scale(2.6);animation-timing-function:cubic-bezier(.2,.7,.3,1);}22%{opacity:1;transform:scale(.88);animation-timing-function:ease-in-out;}28%{opacity:1;transform:scale(1.04);}32%{opacity:1;transform:scale(1);}100%{opacity:1;transform:scale(1);}}@keyframes  ki4-ring{0%{opacity:0;transform:scale(3.4);}21%{opacity:0;transform:scale(3.4);}22%{opacity:0.55;transform:scale(3.4);animation-timing-function:cubic-bezier(.2,.7,.3,1);}42%{opacity:0;transform:scale(5.6);}100%{opacity:0;transform:scale(5.6);}}@keyframes  ki4-pig{0%{opacity:0;transform:scale(.55);}42%{opacity:0;transform:scale(.55);}43%{opacity:1;transform:scale(.55);animation-timing-function:cubic-bezier(.3,1.5,.5,1);}66%{opacity:1;transform:scale(1);animation-timing-function:ease-in-out;}72%{opacity:1;transform:scale(1.04,.96);animation-timing-function:ease-in-out;}80%{opacity:1;transform:scale(.99,1.01);}86%{opacity:1;transform:scale(1);}100%{opacity:1;transform:scale(1);}}</style><defs><clipPath id="kk-tile-clip"><rect width="1024" height="1024" rx="240"/></clipPath></defs><g clip-path="url(#kk-tile-clip)"><rect width="1024" height="1024" fill="#070A14"/><g transform="translate(512 512) scale(1.85) translate(0 73.15)"><g class="kk-m kk-all"><g class="kk-m kk-coin"><g class="kk-m kk-coinx"><circle class="kk-m kk-ring" cx="0" cy="-219" r="62" fill="none" stroke="#FFC53D" stroke-width="10" opacity="0"/><g class="kk-m kk-coinin"><circle cx="0" cy="-219" r="62" fill="#FFC53D"/><g class="kk-m kk-ck"><g transform="translate(0 -219) scale(0.123) translate(-469.32 -508.3)" fill="#070A14"><rect x="246.5" y="224.5" width="121.7" height="567.6" rx="54"/><path d="M314.72 530L583.1 249.78A82 82 0 0 1 642.32 224.5L642.43 224.5A47 47 0 0 1 676.07 304.32L455.93 530Z"/><path d="M339.08 500L592.42 766.59A82 82 0 0 0 651.86 792.1L657.84 792.1A47 47 0 0 0 692.13 712.96L464.4 470Z"/></g></g></g></g></g><g class="kk-m kk-pig"><path class="kk-m kk-ear kk-earl" pathLength="100" d="M-113.6 -62.6L-105.3 -186.3L-47 -120.9" fill="#070A14" stroke="#F9F3E6" stroke-width="26" stroke-linejoin="round" stroke-linecap="round"/><path class="kk-m kk-ear kk-earr" pathLength="100" d="M113.6 -62.6L105.3 -186.3L47 -120.9" fill="#070A14" stroke="#F9F3E6" stroke-width="26" stroke-linejoin="round" stroke-linecap="round"/><circle class="kk-m kk-headfill" r="129.7" fill="#070A14"/><circle class="kk-m kk-headline" pathLength="100" r="129.7" fill="none" stroke="#F9F3E6" stroke-width="26"/><g class="kk-m kk-eyes"><circle class="kk-m kk-eye kk-eyel" cx="-48.6" cy="-24" r="16" fill="#F9F3E6"/><circle class="kk-m kk-eye kk-eyer" cx="48.6" cy="-24" r="16" fill="#F9F3E6"/></g><g class="kk-m kk-snout"><ellipse class="kk-m kk-snouter" pathLength="100" cx="0" cy="48.6" rx="56.75" ry="40.5" fill="none" stroke="#F9F3E6" stroke-width="22.6"/><circle class="kk-m kk-nostril" cx="-